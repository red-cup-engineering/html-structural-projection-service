name: HTML Structural Projection · native receiving

# Public source qualification uses public runner capacity and public actions.
# A public caller cannot resolve the private shared reusable workflow. Keep the
# same pinned toolchain, frozen graph, disabled lifecycle scripts and native
# checks here without copying the private supplier or expanding its access.
on:
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "examples/**"
      - "specification/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Read the exact source revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select the original Node toolchain
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.22.1"
          # pnpm is invoked by npm exec below, not installed on PATH during setup.
          package-manager-cache: false
      # npm selects the pnpm tool from npmjs; its registry override must not
      # leak into pnpm, which reads this source repository's .npmrc.
      - name: Install the original frozen dependency graph without lifecycle scripts
        run: npm exec --yes --registry=https://registry.npmjs.org --package=pnpm@11.19.0 -- env -u npm_config_registry -u NPM_CONFIG_REGISTRY pnpm install --frozen-lockfile --ignore-scripts
      - name: Check native source
        run: npm exec --yes --registry=https://registry.npmjs.org --package=pnpm@11.19.0 -- env -u npm_config_registry -u NPM_CONFIG_REGISTRY pnpm run check
      - name: Test native source and real parser behavior
        run: npm exec --yes --registry=https://registry.npmjs.org --package=pnpm@11.19.0 -- env -u npm_config_registry -u NPM_CONFIG_REGISTRY pnpm test

      - name: Receive installed public source codec
        run: npm exec --yes --registry=https://registry.npmjs.org --package=pnpm@11.19.0 -- env -u npm_config_registry -u NPM_CONFIG_REGISTRY pnpm run test:consumer
